<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#102a43" />
  <title>서울 드라이브 챌린지</title>
  <style>
    :root{--ink:#102a43;--paper:#fffaf0;--yellow:#ffd43b;--red:#ff5b5b;--blue:#2f80ed;--green:#29b36b;--shadow:0 8px 0 rgba(16,42,67,.14)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:ui-rounded,"Arial Rounded MT Bold","Noto Sans KR",system-ui,sans-serif;background:#9ed8f5;color:var(--ink);overscroll-behavior:none}
    body{background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.7) 0 3px,transparent 4px),linear-gradient(#9ed8f5 0 42%,#dff3e5 42% 100%);background-size:90px 90px,auto;display:flex;justify-content:center}
    button{font:inherit;color:inherit}.shell{width:min(1180px,100%);padding:18px clamp(10px,3vw,30px) 24px;display:flex;flex-direction:column;gap:12px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;background:var(--yellow);border:4px solid var(--ink);border-radius:18px;display:grid;place-items:center;font-size:32px;transform:rotate(-4deg);box-shadow:4px 5px 0 var(--ink)}
    h1{font-size:clamp(23px,4vw,42px);line-height:.95;margin:0;letter-spacing:-.06em}.tagline{font-size:13px;font-weight:800;margin-top:7px;opacity:.7}.key-guide{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.key{background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:900;white-space:nowrap}.key.a{background:#c9f7d9}.key.b{background:#ffd3d3}
    .hud{display:grid;grid-template-columns:1.15fr 1fr 1fr .8fr;gap:8px}.hud-card{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:16px;padding:9px 12px;box-shadow:var(--shadow);min-width:0}.label{font-size:11px;font-weight:900;letter-spacing:.08em;opacity:.55}.value{font-size:clamp(16px,2.5vw,23px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.level-dots{display:flex;gap:5px;margin-top:4px}.dot{height:7px;flex:1;border:2px solid var(--ink);border-radius:99px;background:#e6edf2}.dot.on{background:var(--yellow)}
    .game-wrap{position:relative;border:5px solid var(--ink);border-radius:24px;overflow:hidden;background:#60ad5e;box-shadow:0 11px 0 var(--ink);aspect-ratio:16/9;min-height:310px}.game-wrap canvas{display:block;width:100%;height:100%;touch-action:none}.game-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 45px rgba(16,42,67,.22)}
    .top-buttons{position:absolute;right:12px;top:12px;z-index:4;display:flex;gap:7px}.icon-btn{border:3px solid var(--ink);background:#fff;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:20px;font-weight:1000;box-shadow:0 4px 0 var(--ink);cursor:pointer}.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
    .message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:min(540px,90%);background:rgba(255,250,240,.97);border:5px solid var(--ink);border-radius:24px;padding:clamp(18px,4vw,34px);text-align:center;box-shadow:0 10px 0 var(--ink)}.message[hidden]{display:none}.message .eyebrow{display:inline-block;padding:5px 11px;border-radius:99px;background:var(--yellow);border:2px solid var(--ink);font-size:12px;font-weight:1000}.message h2{font-size:clamp(25px,5vw,44px);margin:10px 0 7px;letter-spacing:-.05em}.message p{font-weight:750;line-height:1.55;margin:0 auto 18px;max-width:430px}.primary{border:4px solid var(--ink);background:var(--red);color:#fff;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:1000;box-shadow:0 6px 0 var(--ink);cursor:pointer}.primary:hover{filter:brightness(1.08)}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
    .controls{display:none;grid-template-columns:1fr 1.15fr;gap:14px;margin-top:5px;touch-action:none}.steer,.pedals{display:flex;gap:10px}.ctrl{flex:1;min-height:68px;border:4px solid var(--ink);border-radius:18px;background:#fff;font-size:26px;font-weight:1000;box-shadow:0 6px 0 var(--ink);user-select:none}.ctrl.gas{background:#aaf0bd}.ctrl.brake{background:#ffb8b8}.ctrl.pressed,.ctrl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);filter:saturate(1.3)}
    .tips{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;font-weight:850;padding:5px 4px 0}.tips span:last-child{text-align:right}.signal{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 0 3px rgba(41,179,107,.2)}
    @media(max-width:760px){.shell{padding-top:10px}.key-guide{display:none}.hud{grid-template-columns:1.3fr 1fr 1fr}.hud-card:nth-child(4){display:none}.controls{display:grid}.tips{display:none}.game-wrap{min-height:290px}header{align-items:center}.logo{width:46px;height:46px;font-size:25px;border-width:3px;box-shadow:3px 4px 0 var(--ink)}}
    @media(max-width:440px){.brand .tagline{display:none}.hud-card{padding:7px 8px;border-width:2px}.value{font-size:15px}.game-wrap{border-width:4px;border-radius:17px;min-height:270px;aspect-ratio:1.3}.controls{gap:8px}.ctrl{min-height:62px}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="logo">🏎️</div><div><h1>서울 드라이브<br>챌린지</h1><div class="tagline">안전하게 달리고, 5단계 서울 도심을 정복하자!</div></div></div>
      <div class="key-guide"><span class="key">← → 방향</span><span class="key a">A 액셀</span><span class="key b">B 브레이크</span></div>
    </header>
    <section class="hud" aria-label="게임 정보">
      <div class="hud-card"><div class="label">현재 코스</div><div class="value" id="levelName">1단계 · 운전 시험장</div><div class="level-dots" id="levelDots"></div></div>
      <div class="hud-card"><div class="label">속도</div><div class="value"><span id="speed">0</span> <small>km/h</small></div></div>
      <div class="hud-card"><div class="label">진행</div><div class="value"><span id="progress">0</span>%</div></div>
      <div class="hud-card"><div class="label">자동 변속</div><div class="value" id="gear">P</div></div>
    </section>
    <section class="game-wrap" id="gameWrap">
      <canvas id="game" width="1120" height="630" aria-label="자동차 운전 게임"></canvas>
      <div class="top-buttons"><button class="icon-btn" id="soundBtn" aria-label="소리 켜기 또는 끄기">🔊</button><button class="icon-btn" id="pauseBtn" aria-label="게임 일시정지">Ⅱ</button></div>
      <div class="message" id="message">
        <span class="eyebrow">운전 준비 완료!</span>
        <h2>출발해 볼까요?</h2>
        <p>노란 화살표를 따라 체크포인트를 통과하세요. 도로 밖이나 장애물은 피하고, A키로 달리고 B키로 멈춰요!</p>
        <button class="primary" id="startBtn">1단계 시작</button>
      </div>
    </section>
    <section class="controls" aria-label="터치 조작">
      <div class="steer"><button class="ctrl" data-key="left" aria-label="왼쪽">◀</button><button class="ctrl" data-key="right" aria-label="오른쪽">▶</button></div>
      <div class="pedals"><button class="ctrl gas" data-key="gas" aria-label="액셀">A<br><small>액셀</small></button><button class="ctrl brake" data-key="brake" aria-label="브레이크">B<br><small>브레이크</small></button></div>
    </section>
    <div class="tips"><span><i class="signal"></i>자동 저장됨 · 최고 도달 <b id="bestLevel">1단계</b></span><span>Tip: 커브 전에는 B키로 속도를 줄여요!</span></div>
  </main>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const ui={message:document.getElementById('message'),start:document.getElementById('startBtn'),pause:document.getElementById('pauseBtn'),sound:document.getElementById('soundBtn'),level:document.getElementById('levelName'),speed:document.getElementById('speed'),progress:document.getElementById('progress'),gear:document.getElementById('gear'),dots:document.getElementById('levelDots'),best:document.getElementById('bestLevel')};
  const W=1120,H=630,keys={left:false,right:false,gas:false,brake:false};
  const courses=[
    {name:'운전 시험장',sky:'#9bd7f2',grass:'#63bd65',road:'#68727a',width:132,pts:[[190,445],[130,290],[225,140],[520,115],[805,145],[950,290],[875,475],[585,520],[320,515]],decor:'test',traffic:0},
    {name:'강변 도로',sky:'#9bd7f2',grass:'#56b978',road:'#64717d',width:120,pts:[[130,470],[125,300],[250,170],[480,220],[650,125],[925,170],[980,355],[830,485],[570,455],[340,535]],decor:'river',traffic:2},
    {name:'도심 진입로',sky:'#a9d7e8',grass:'#61ad65',road:'#5e6874',width:112,pts:[[120,475],[145,205],[365,125],[520,285],[700,120],[965,210],[940,470],[720,510],[505,430],[300,535]],decor:'town',traffic:4},
    {name:'서울 대로',sky:'#acd2e8',grass:'#639b66',road:'#59636e',width:105,pts:[[115,500],[115,170],[360,130],[370,335],[560,500],[710,350],[695,130],[980,145],[990,500]],decor:'boulevard',traffic:6},
    {name:'서울 도심',sky:'#b5d1e2',grass:'#5f9361',road:'#525d68',width:98,pts:[[105,515],[105,150],[345,145],[350,365],[560,510],[755,405],[665,250],[735,120],[1000,145],[980,515]],decor:'seoul',traffic:8}
  ];
  let level=0,checkpoint=1,running=false,paused=false,last=0,shake=0,sound=true,elapsed=0;
  let car={x:0,y:0,a:0,speed:0,flash:0}; let traffic=[]; let audioCtx=null;
  let best=Math.min(5,Math.max(1,Number(localStorage.getItem('seoulDriveBest')||1)));ui.best.textContent=best+'단계';
  function initDots(){ui.dots.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('i');d.className='dot'+(i<=level?' on':'');ui.dots.appendChild(d)}}
  function resetLevel(){const c=courses[level],p=c.pts[0],n=c.pts[1];car={x:p[0],y:p[1],a:Math.atan2(n[1]-p[1],n[0]-p[0]),speed:0,flash:0};checkpoint=1;elapsed=0;traffic=[];for(let i=0;i<c.traffic;i++)traffic.push({t:(i+1)/(c.traffic+1),speed:.018+i*.0015,color:['#ff6b6b','#4dabf7','#ffd43b','#b197fc'][i%4]});updateHUD()}
  function updateHUD(){const c=courses[Math.min(level,4)];ui.level.textContent=(Math.min(level,4)+1)+'단계 · '+c.name;ui.speed.textContent=Math.round(car.speed*18);ui.gear.textContent=!running?'P':car.speed<.35?'N':car.speed<2.2?'D1':car.speed<4.1?'D2':'D3';ui.progress.textContent=Math.round((checkpoint-1)/(c.pts.length-1)*100);initDots()}
  function nearestOnTrack(px,py,pts){let min=1e9;for(let i=0;i<pts.length-1;i++){let a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy))),x=a[0]+dx*t,y=a[1]+dy*t;min=Math.min(min,Math.hypot(px-x,py-y))}return min}
  function beep(freq=440,dur=.08){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
  function showCard(eyebrow,title,text,button){ui.message.hidden=false;ui.message.querySelector('.eyebrow').textContent=eyebrow;ui.message.querySelector('h2').textContent=title;ui.message.querySelector('p').textContent=text;ui.start.textContent=button}
  function start(){if(level>=5)level=0;resetLevel();ui.message.hidden=true;running=true;paused=false;ui.pause.textContent='Ⅱ';last=performance.now();beep(520,.12);requestAnimationFrame(loop)}
  function finishLevel(){running=false;car.speed=0;beep(660,.12);setTimeout(()=>beep(880,.18),100);if(level===4){localStorage.setItem('seoulDriveBest','5');ui.best.textContent='5단계';showCard('미션 성공!','서울 드라이브 마스터!','5개 코스를 모두 멋지게 완주했어요. 안전 운전 실력이 최고예요!','처음부터 다시 달리기');level=5}else{level++;best=Math.max(best,level+1);localStorage.setItem('seoulDriveBest',best);ui.best.textContent=best+'단계';showCard('코스 통과!','다음은 '+(level+1)+'단계','교통량이 늘고 길이 더 복잡해져요. 천천히 살피며 안전하게 달려 보세요!','다음 단계 출발');updateHUD()}}
  function update(dt){const c=courses[level];elapsed+=dt;if(keys.gas)car.speed+=4.5*dt;if(keys.brake)car.speed*=Math.pow(.82,dt*60);car.speed*=Math.pow(.982,dt*60);car.speed=Math.max(0,Math.min(6.2,car.speed));const turn=(.75+Math.min(car.speed,4)*.22)*dt;if(car.speed>.08){if(keys.left)car.a-=turn;if(keys.right)car.a+=turn}car.x+=Math.cos(car.a)*car.speed*60*dt;car.y+=Math.sin(car.a)*car.speed*60*dt;car.x=Math.max(18,Math.min(W-18,car.x));car.y=Math.max(18,Math.min(H-18,car.y));const off=nearestOnTrack(car.x,car.y,c.pts)>c.width*.53;if(off){car.speed*=Math.pow(.94,dt*60);shake=Math.min(7,shake+1)}else shake*=.88;car.flash=Math.max(0,car.flash-dt);
    const target=c.pts[checkpoint];if(target&&Math.hypot(car.x-target[0],car.y-target[1])<55){checkpoint++;beep(560+checkpoint*30,.06);if(checkpoint>=c.pts.length)finishLevel()}
    for(const t of traffic){t.t=(t.t+t.speed*dt)%1;const p=pointAlong(c.pts,t.t);if(Math.hypot(car.x-p.x,car.y-p.y)<34&&car.speed>.4){car.speed=0;car.flash=.4;shake=9;beep(150,.12)}}updateHUD()}
  function pointAlong(pts,t){let lens=[],total=0;for(let i=0;i<pts.length-1;i++){let l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);lens.push(l);total+=l}let d=t*total;for(let i=0;i<lens.length;i++){if(d<=lens[i]){let q=d/lens[i],a=pts[i],b=pts[i+1];return{x:a[0]+(b[0]-a[0])*q,y:a[1]+(b[1]-a[1])*q,a:Math.atan2(b[1]-a[1],b[0]-a[0])}}d-=lens[i]}return{x:pts[0][0],y:pts[0][1],a:0}}
  function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
  function drawDecor(c){ctx.fillStyle=c.sky;ctx.fillRect(0,0,W,H);ctx.fillStyle=c.grass;ctx.fillRect(0,70,W,H-70);ctx.fillStyle='rgba(255,255,255,.65)';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(45+i*145,38+(i%2)*12,16+(i%3)*5,0,Math.PI*2);ctx.fill()}
    if(c.decor==='river'){ctx.fillStyle='#55bde9';ctx.fillRect(0,75,W,58);ctx.fillStyle='#d9f3ff';for(let x=20;x<W;x+=75)ctx.fillRect(x,95,36,5)}
    const buildings=c.decor==='seoul'?[[15,120,68,190],[200,35,86,94],[430,55,90,105],[830,55,105,80],[1015,220,78,220]]:c.decor==='boulevard'?[[15,110,75,155],[430,75,100,90],[830,70,120,55],[1010,250,80,190]]:c.decor==='town'?[[22,115,82,115],[430,42,105,65],[830,55,110,85]]:[];
    for(let i=0;i<buildings.length;i++){let b=buildings[i];roundRect(b[0],b[1],b[2],b[3],6,['#ffcc80','#90caf9','#ef9a9a','#b39ddb'][i%4],'#102a43');ctx.lineWidth=3;ctx.fillStyle='#fff4b8';for(let yy=b[1]+17;yy<b[1]+b[3]-10;yy+=25)for(let xx=b[0]+12;xx<b[0]+b[2]-8;xx+=27)ctx.fillRect(xx,yy,12,10)}
    if(c.decor==='seoul'){ctx.fillStyle='#f7f1df';ctx.fillRect(505,55,18,110);ctx.beginPath();ctx.moveTo(514,15);ctx.lineTo(490,65);ctx.lineTo(538,65);ctx.fill();ctx.fillStyle='#e8505b';ctx.fillRect(509,82,10,12);ctx.fillStyle='#102a43';ctx.font='bold 20px sans-serif';ctx.fillText('SEOUL',540,72)}
    if(c.decor==='test'){ctx.fillStyle='#fff';ctx.font='900 22px sans-serif';ctx.fillText('운전면허 시험장',430,54)}
  }
  function drawRoad(c){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(c.pts[0][0],c.pts[0][1]);for(let i=1;i<c.pts.length;i++)ctx.lineTo(c.pts[i][0],c.pts[i][1]);ctx.lineWidth=c.width+18;ctx.strokeStyle='#ece8dc';ctx.stroke();ctx.lineWidth=c.width;ctx.strokeStyle=c.road;ctx.stroke();ctx.setLineDash([24,24]);ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.stroke();ctx.setLineDash([]);ctx.restore();for(let i=1;i<c.pts.length;i++){const p=c.pts[i];if(i===checkpoint){ctx.save();ctx.translate(p[0],p[1]);const pulse=1+Math.sin(performance.now()/150)*.1;ctx.scale(pulse,pulse);ctx.fillStyle='rgba(255,212,59,.28)';ctx.beginPath();ctx.arc(0,0,45,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd43b';ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,0,29,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#102a43';ctx.font='1000 19px sans-serif';ctx.textAlign='center';ctx.fillText('GO',0,7);ctx.restore()}else if(i<checkpoint){ctx.fillStyle='#29b36b';ctx.beginPath();ctx.arc(p[0],p[1],8,0,Math.PI*2);ctx.fill()}}
    if(c.decor==='test')for(let i=1;i<c.pts.length-1;i++){let p=c.pts[i];drawCone(p[0]+Math.cos(i)*45,p[1]+Math.sin(i)*45)}
  }
  function drawCone(x,y){ctx.fillStyle='#ff7a00';ctx.beginPath();ctx.moveTo(x,y-11);ctx.lineTo(x-9,y+10);ctx.lineTo(x+9,y+10);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-6,y,12,4)}
  function drawCar(x,y,a,color='#e63946',player=false){ctx.save();ctx.translate(x,y);ctx.rotate(a);if(player){ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(-1,5,27,16,0,0,Math.PI*2);ctx.fill()}roundRect(-24,-15,48,30,8,color,'#102a43');ctx.lineWidth=3;ctx.fillStyle='#bce9ff';ctx.fillRect(-8,-11,17,22);ctx.fillStyle='#102a43';ctx.fillRect(-18,-18,10,5);ctx.fillRect(9,-18,10,5);ctx.fillRect(-18,13,10,5);ctx.fillRect(9,13,10,5);ctx.fillStyle='#fff3a3';ctx.fillRect(18,-10,6,7);ctx.fillRect(18,4,6,7);if(player){ctx.fillStyle='#fff';ctx.font='1000 11px sans-serif';ctx.textAlign='center';ctx.fillText('YOU',1,4)}ctx.restore()}
  function draw(){const c=courses[Math.min(level,4)];ctx.save();if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawDecor(c);drawRoad(c);for(const t of traffic){const p=pointAlong(c.pts,t.t);drawCar(p.x,p.y,p.a,t.color)}drawCar(car.x,car.y,car.a,car.flash>0?'#fff':'#e63946',true);ctx.restore();if(paused){ctx.fillStyle='rgba(16,42,67,.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='1000 48px sans-serif';ctx.textAlign='center';ctx.fillText('잠깐 쉬는 중!',W/2,H/2)}}
  function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;if(!paused)update(dt);draw();if(running)requestAnimationFrame(loop)}
  function setKey(e,on){const k=e.key.toLowerCase();if(['arrowleft','arrowright','a','b'].includes(k))e.preventDefault();if(k==='arrowleft')keys.left=on;if(k==='arrowright')keys.right=on;if(k==='a')keys.gas=on;if(k==='b')keys.brake=on}
  addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'){paused=!paused;ui.pause.textContent=paused?'▶':'Ⅱ'}setKey(e,true)});addEventListener('keyup',e=>setKey(e,false));
  document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key,down=e=>{e.preventDefault();keys[k]=true;btn.classList.add('pressed')},up=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('pressed')};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)});
  ui.start.addEventListener('click',start);ui.pause.addEventListener('click',()=>{if(!running)return;paused=!paused;ui.pause.textContent=paused?'▶':'Ⅱ'});ui.sound.addEventListener('click',()=>{sound=!sound;ui.sound.textContent=sound?'🔊':'🔇'});addEventListener('blur',()=>{if(running){paused=true;ui.pause.textContent='▶'}});
  resetLevel();draw();
})();
</script>
</body>
</html>
